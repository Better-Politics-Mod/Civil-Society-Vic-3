l_english:
  CISO_SOCIETY: "Society"
  CISO_SOCIETY_SOCIAL_ATMOSPHERE: "Atmosphere"
  CISO_SOCIETY_CIVINSTS: "Civil Institutions"

  CISO_CIVINST_NAME: "Heavy Industry Unions"
  CISO_CIVINST_SUPPORT: "[State.MakeScope.ScriptValue(Concatenate(Scope.GetFlagName, '_population'))|vD0]"
  CISO_CIVINST_ORGANIZATION: "[State.MakeScope.ScriptValue(Concatenate(Scope.GetFlagName, '_organization'))|vD0] ([State.MakeScope.ScriptValue(Concatenate(Scope.GetFlagName, '_org_trend'))|v=2])"
  CISO_CIVINST_SI: "[State.MakeScope.ScriptValue(Concatenate(Scope.GetFlagName, '_social_impact'))|vD0]" # ciso_ci_tammany_hall_ms_weights


  CISO_SOCIETY_POTENTIAL_CIVINSTS: "Potential Civil Institutions"
  CISO_SOCIETY_NEEDS: "Needs"
  CISO_SOCIETY_MEASURES: "Measures"

  CISO_SOCIETY_MEASURE_INITIAL_INVESTMENT: "Invest"
  CISO_SOCIETY_MEASURE_POTENTIAL_MEASURE: "Can Invest"
 

  ciso_ne_welfare_name: "Welfare"

  CISO_SOCIETY_SOCIAL_ATMOSPHERE_TEXT: "[State.GetCustom('ciso_atmo_cusloc')] ([State.MakeScope.ScriptValue('ciso_state_atmosphere_value')|v2])"
  ciso_atmo_chaos: "#N;bold Chaos#!"
  ciso_atmo_tense: "#N Tense#!"
  ciso_atmo_stable: "#grey;bold Stable#!"
  ciso_atmo_optimistic: "#green Optimistic#!"

  CISO_SOCIETY_DEFENSIVE_TT: "#tooltip_header Defensive Stance#!\n$TOOLTIP_DELIMITER$\nA #gold Civil Institution#! in a Defensive Stance will focus on protecting the different #gold Measures#! it offers to the population. It will not lose any #gold Social Impact#! from being attacked, but it loses out on potential gains from cooperating or competing with other #gold Civil Institutions#!."
  CISO_SOCIETY_COOPERATE_TT: "#tooltip_header Cooperative Stance#!\n$TOOLTIP_DELIMITER$\nA #gold Civil Institution#! in a Cooperative Stance will focus on working together with other #gold Civil Institutions#! to provide better #gold Measures#! to the population. It will gain more #gold Social Impact#! from working with other #gold Civil Institutions#! on the same #gold Measures#!, but it risks losing some #gold Social Impact#! if it is attacked by another #gold Civil Institution#!."
  CISO_SOCIETY_ATTACK_TT: "#tooltip_header Aggressive Stance#!\n$TOOLTIP_DELIMITER$\nA #gold Civil Institution#! in an Aggressive Stance will focus on attacking other #gold Civil Institutions#!, reducing their #gold Social Impact#! and potentially taking over their #gold Measures#!. It will not gain #gold Social Impact#! from attacking, but it can drive out other #gold Civil Institutions#! and take over their #gold Measures#! if they are weakened enough."